# Every relative path below is relative to project_root, not the launcher's cwd.
project_root: ../..

dp:
  repo: ../dp_hirol_main
  checkpoint: ../dp_hirol_main/data/outputs/2026.11.05/22.45.54_375874_dp_distill_pipeline/teacher/checkpoints/optimizer_step=00180000.ckpt
  backbone: ../dp_hirol_main/model/model/dinov3-vitb16-pretrain-lvd1689m
  state_key: ema_model
  diffusion_steps: null # Restore the checkpoint's DDIM inference steps (8).

cad_wm:
  repo: cad-wm
  train_config: cad-wm/config/bench_train_config/libero_drawer_wrench_h5.yaml
  checkpoint: cad-wm/outputs/cad_wm_median3_200k/checkpoints/step_00180000.pt
  device: null # Same as runtime.device unless overridden.
  steps: null # Restore flow integration settings from the CAD-WM checkpoint.
  solver: null

runtime:
  device: cuda:0
  seed: 42
  amp_enabled: true # DP only; CAD-WM follows WrenchPredictor's float32 path.
  amp_dtype: bfloat16
  timing_tolerance_s: 0.001
  # The DP teacher was trained from the raw wrench LeRobot dataset.  Use the
  # measured phase stream for its causal hysteresis state; future wrench input
  # still always comes from CAD-WM.
  # cad_wm: previous forecast's first token estimates current phase wrench.
  # measured: current measured wrench is used for phase history.
  # Future network wrench always comes from CAD-WM in either mode.
  phase_wrench_source: measured
  # Physical-unit, episode-local low-pass before teacher contact processing.
  # This older teacher did not enable the Dataset filter during training.
  wrench_filter:
    enabled: false
    cutoff_hz: 2.0
  # Match the teacher checkpoint's original per-token future preprocessing.
  future_contact_mode: token_threshold
  # Confirm contact across consecutive sensor frames, matching overlapping
  # forecast times. Close immediately on a free forecast to avoid stale input.
  # At 20 Hz, two matching frames add 50 ms of confirmation delay.
  future_contact_stabilization:
    enabled: true
    enter_frames: 2
    exit_frames: 1
  # Print each raw CAD-WM force-norm chunk and the corresponding DP input chunk.
  print_wrench_chunks: true
  # DP action index 0 is the current observation anchor; execute the next
  # native-rate target so the online controller advances through the trajectory.
  execution_action_index: 1

# Optional offline replay: uses only images and histories ending at each row.
# It emits pose predictions; it does not step a simulator or execute a robot.
replay:
  dataset: dataset/wm_data/KITCHEN_SCENE1_open_the_top_drawer_of_the_cabinet_and_put_the_bowl_in_it_demo_wrench_with_dq_tau.hdf5
  demo: demo_0
  start_frame: 0
  max_frames: 100
  predict_every: 1
  output: outputs/inference/fdp_cad_wm_teacher_180k_raw_wm_demo_0.npz
  fields:
    timestamp: states # First column, seconds.
    q: obs/joint_states
    dq: obs/dq
    tau: obs/tau
    joint_columns: [0, 1, 2, 3, 4, 5, 6]
    cameras:
      wrist: obs/eye_in_hand_rgb
      side: obs/agentview_rgb
    wrench: obs/wrenches # Read ONLY for phase_wrench_source: measured.
